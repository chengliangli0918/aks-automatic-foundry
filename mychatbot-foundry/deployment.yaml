apiVersion: apps/v1
kind: Deployment
metadata:
  name: mychatbot
  labels:
    app: mychatbot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mychatbot
      azure.workload.identity/use: "true"
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: mychatbot
        azure.workload.identity/use: "true"
        prometheus.io/scrape: "true"
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: mychatbot
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: mychatbot
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
      - name: mychatbot
        image: charliliacr.azurecr.io/mychatbot:v1
        imagePullPolicy: Always
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          failureThreshold: 12
          periodSeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          failureThreshold: 12
          periodSeconds: 5
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /
            port: 8080
          failureThreshold: 20
          periodSeconds: 5
          timeoutSeconds: 5
        env:
        - name: TITLE
          value: "My Chatbot"
        - name: TEMPERATURE
          value: "0.9"
        - name: MODEL_ENDPOINT
          value: "https://charlili-foundry.services.ai.azure.com/models"
        - name: MODEL_DEPLOYMENT
          value: "gpt-5.4-mini"
